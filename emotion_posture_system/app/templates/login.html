<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập — EMO-POSTURE AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4"
  >
    <div
      class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl space-y-6"
    >
      <div class="text-center">
        <h1 class="text-2xl font-extrabold text-cyan-400 tracking-wide">
          EMO-POSTURE AI
        </h1>
        <p class="text-xs text-slate-400 mt-1">
          Hệ thống dự đoán trạng thái cảm xúc qua tư thế và khuôn mặt
        </p>
      </div>

      {% if success %}
      <div
        class="p-3 rounded-xl bg-emerald-500/15 border border-emerald-500/40 text-emerald-300 text-sm"
      >
        {{ success }}
      </div>
      {% endif %} {% if error %}
      <div
        class="p-3 rounded-xl bg-rose-500/15 border border-rose-500/40 text-rose-300 text-sm"
      >
        {{ error }}
      </div>
      {% endif %}

      <form method="POST" action="/login" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5"
            >Tên đăng nhập hoặc Email</label
          >
          <input
            name="username"
            type="text"
            required
            value="{{ username }}"
            placeholder="Nhập tên đăng nhập hoặc email"
            class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-slate-100 text-sm focus:outline-none focus:border-cyan-400"
          />
        </div>

        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="block text-xs font-semibold text-slate-300"
              >Mật khẩu</label
            >
            <a
              href="/forgot-password"
              class="text-xs text-cyan-400 hover:text-cyan-300 transition"
              >Quên mật khẩu?</a
            >
          </div>
          <input
            name="password"
            type="password"
            required
            placeholder="Nhập mật khẩu"
            class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-slate-100 text-sm focus:outline-none focus:border-cyan-400"
          />
        </div>

        <button
          type="submit"
          class="w-full py-2.5 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-sm transition shadow-lg shadow-cyan-500/20"
        >
          Đăng nhập
        </button>
      </form>

      <div
        class="pt-4 border-t border-slate-800 text-center text-xs text-slate-400"
      >
        Chưa có tài khoản?
        <a
          href="/register"
          class="text-cyan-400 hover:text-cyan-300 font-semibold ml-1"
          >Đăng ký tài khoản mới</a
        >
      </div>
    </div>
  </body>
</html>
