<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng ký tài khoản — EMO-POSTURE AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4"
  >
    <div
      class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl space-y-6"
    >
      <div class="text-center">
        <h1 class="text-2xl font-extrabold text-cyan-400">Đăng ký tài khoản</h1>
        <p class="text-xs text-slate-400 mt-1">
          Tạo tài khoản người dùng mới (vai trò mặc định: User)
        </p>
      </div>

      {% if error %}
      <div
        class="p-3 rounded-xl bg-rose-500/15 border border-rose-500/40 text-rose-300 text-sm"
      >
        {{ error }}
      </div>
      {% endif %}

      <form method="POST" action="/register" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5"
            >Họ và tên</label
          >
          <input
            name="full_name"
            type="text"
            required
            value="{{ full_name }}"
            placeholder="Ví dụ: Nguyễn Văn Minh"
            class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-slate-100 text-sm focus:outline-none focus:border-cyan-400"
          />
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5"
            >Địa chỉ Email</label
          >
          <input
            name="email"
            type="email"
            required
            value="{{ email }}"
            placeholder="email@example.com"
            class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-slate-100 text-sm focus:outline-none focus:border-cyan-400"
          />
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5"
            >Mật khẩu</label
          >
          <input
            name="password"
            type="password"
            required
            placeholder="Tối thiểu 8 ký tự (chữ hoa, chữ thường, số)"
            class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-slate-100 text-sm focus:outline-none focus:border-cyan-400"
          />
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5"
            >Xác nhận mật khẩu</label
          >
          <input
            name="confirm_password"
            type="password"
            required
            placeholder="Nhập lại mật khẩu"
            class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-slate-100 text-sm focus:outline-none focus:border-cyan-400"
          />
        </div>

        <button
          type="submit"
          class="w-full py-2.5 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-sm transition shadow-lg shadow-cyan-500/20"
        >
          Đăng ký
        </button>
      </form>

      <div
        class="pt-4 border-t border-slate-800 text-center text-xs text-slate-400"
      >
        Đã có tài khoản?
        <a
          href="/login"
          class="text-cyan-400 hover:text-cyan-300 font-semibold ml-1"
          >Quay lại Đăng nhập</a
        >
      </div>
    </div>
  </body>
</html>
